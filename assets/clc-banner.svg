<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Complementary Lattice Correction</title>
  <desc id="desc">A dark, colorful banner for a paper-aligned low-bit language-model quantization project, compatible with vLLM, SGLang, TGI, LMDeploy, Hugging Face Transformers, TensorRT-LLM, llama.cpp, and Ollama.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D18"/>
      <stop offset="0.52" stop-color="#11162B"/>
      <stop offset="1" stop-color="#081D28"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="330" y1="112" x2="1060" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE9FD"/>
      <stop offset="0.48" stop-color="#C8A6FF"/>
      <stop offset="1" stop-color="#FF9ACB"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="0" x2="1220" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M0 0H48M0 0V48" stroke="#7DD3FC" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1400" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1400" height="420" fill="#0B1020"/>
    <rect width="1400" height="420" fill="url(#bg)"/>
    <rect width="1400" height="420" fill="url(#grid)"/>
    <circle cx="1270" cy="30" r="220" fill="#7C3AED" fill-opacity="0.12"/>
    <circle cx="80" cy="390" r="250" fill="#06B6D4" fill-opacity="0.11"/>

    <g opacity="0.72" stroke="url(#accent)" stroke-width="2">
      <path d="M-70 272L210 110L480 270L760 102L1040 260L1470 22"/>
      <path d="M-50 334L230 172L500 332L780 164L1060 322L1490 84"/>
      <path d="M120 82L330 204L540 82L750 204L960 82L1170 204L1380 82"/>
    </g>
    <g fill="#E0F2FE" filter="url(#glow)">
      <circle cx="210" cy="110" r="4"/>
      <circle cx="480" cy="270" r="4"/>
      <circle cx="760" cy="102" r="4"/>
      <circle cx="1040" cy="260" r="4"/>
      <circle cx="330" cy="204" r="4"/>
      <circle cx="750" cy="204" r="4"/>
      <circle cx="1170" cy="204" r="4"/>
    </g>

    <rect x="255" y="20" width="890" height="380" rx="28" fill="#070B14" fill-opacity="0.55" stroke="#C4B5FD" stroke-opacity="0.34"/>
    <text x="700" y="94" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PAPER-ALIGNED POST-TRAINING QUANTIZATION</text>
    <text x="700" y="155" text-anchor="middle" fill="#D8B4FE" stroke="#8BE9FD" stroke-opacity="0.16" stroke-width="0.8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="46" font-weight="800">Complementary Lattice Correction</text>
    <text x="700" y="194" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Correct the integer lattice • preserve the inference graph • deploy the result</text>

    <text x="700" y="228" text-anchor="middle" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">AWQ • GPTQ • COMPRESSED-TENSORS WNA16 • GGUF BRIDGE</text>
    <text x="700" y="258" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">DIRECT LOAD • CONVERSION TARGETS • POPULAR INFERENCE ENGINES</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
      <rect x="335" y="274" width="118" height="40" rx="20" fill="#0E7490" fill-opacity="0.9"/>
      <circle cx="359" cy="294" r="10" fill="#67E8F9" fill-opacity="0.9"/>
      <text x="405" y="299" text-anchor="middle" fill="#ECFEFF">vLLM</text>

      <rect x="465" y="274" width="132" height="40" rx="20" fill="#2563EB" fill-opacity="0.9"/>
      <circle cx="490" cy="294" r="10" fill="#BFDBFE" fill-opacity="0.9"/>
      <text x="540" y="299" text-anchor="middle" fill="#EFF6FF">SGLang</text>

      <rect x="609" y="274" width="90" height="40" rx="20" fill="#EA580C" fill-opacity="0.9"/>
      <circle cx="632" cy="294" r="10" fill="#FED7AA" fill-opacity="0.9"/>
      <text x="674" y="299" text-anchor="middle" fill="#FFF7ED">TGI</text>

      <rect x="711" y="274" width="150" height="40" rx="20" fill="#7C3AED" fill-opacity="0.9"/>
      <circle cx="736" cy="294" r="10" fill="#DDD6FE" fill-opacity="0.9"/>
      <text x="802" y="299" text-anchor="middle" fill="#F5F3FF">LMDeploy</text>

      <rect x="873" y="274" width="192" height="40" rx="20" fill="#15803D" fill-opacity="0.9"/>
      <circle cx="898" cy="294" r="10" fill="#BBF7D0" fill-opacity="0.9"/>
      <text x="976" y="299" text-anchor="middle" fill="#F0FDF4">HF Transformers</text>
    </g>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
      <rect x="430" y="322" width="190" height="40" rx="20" fill="#B45309" fill-opacity="0.9"/>
      <circle cx="454" cy="342" r="10" fill="#FDE68A" fill-opacity="0.9"/>
      <text x="525" y="347" text-anchor="middle" fill="#FFFBEB">TensorRT-LLM</text>

      <rect x="632" y="322" width="170" height="40" rx="20" fill="#475569" fill-opacity="0.96"/>
      <circle cx="657" cy="342" r="10" fill="#CBD5E1" fill-opacity="0.9"/>
      <text x="726" y="347" text-anchor="middle" fill="#F8FAFC">llama.cpp</text>

      <rect x="814" y="322" width="140" height="40" rx="20" fill="#65A30D" fill-opacity="0.9"/>
      <circle cx="838" cy="342" r="10" fill="#D9F99D" fill-opacity="0.9"/>
      <text x="884" y="347" text-anchor="middle" fill="#F7FEE7">Ollama</text>
    </g>

    <text x="700" y="387" text-anchor="middle" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ENGINE-AGNOSTIC CORRECTION • FORMAT-PRESERVING EXPORT • GGUF BRIDGE</text>
  </g>
</svg>
